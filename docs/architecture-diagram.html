<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&display=swap">
<style>
  html, body { margin: 0; background: #EAE0CE; }
  svg { display: block; font-family: "Fraunces", Georgia, serif; }
  .box { fill: #fff; stroke: #3c4043; stroke-width: 1.5; }
  .note { fill: #f6f0e4; stroke: #3c4043; stroke-width: 1.5; stroke-dasharray: 7 6; }
  .t { font-size: 23px; fill: #2b2d30; font-weight: 600; }
  .s { font-size: 16px; fill: #4a4d52; font-weight: 400; }
  .lane { font-size: 15px; fill: #6b6157; letter-spacing: 2px; font-weight: 600; }
  .arrow { stroke: #3c4043; stroke-width: 2.5; fill: none; marker-end: url(#head); }
  .num { fill: #3c4043; }
  .numt { fill: #fff; font-size: 16px; font-weight: 700; text-anchor: middle; }
</style></head><body>
<svg width="1600" height="800" viewBox="0 0 1600 800" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3c4043"/>
    </marker>
  </defs>

  <!-- Lane labels -->
  <text class="lane" x="80" y="50">WHEN AN OWNER SEARCHES</text>
  <text class="lane" x="80" y="585">HOW TOOLS GET INTO THE CATALOG</text>

  <!-- Row A: request flow -->
  <g>
    <rect class="box" x="80" y="68" width="300" height="140" rx="18"/>
    <circle class="num" cx="112" cy="102" r="15"/><text class="numt" x="112" y="108">1</text>
    <text class="t" x="138" y="110">Owner answers</text>
    <text class="s" x="104" y="150">3 questions in their own words</text>
    <text class="s" x="104" y="176">any business, any language</text>
  </g>
  <g>
    <rect class="box" x="460" y="68" width="300" height="140" rx="18"/>
    <circle class="num" cx="492" cy="102" r="15"/><text class="numt" x="492" y="108">2</text>
    <text class="t" x="518" y="110">Website</text>
    <text class="s" x="484" y="150">Static pages on Vercel</text>
    <text class="s" x="484" y="176">no sign-up, works on phones</text>
  </g>
  <g>
    <rect class="box" x="840" y="68" width="300" height="140" rx="18"/>
    <circle class="num" cx="872" cy="102" r="15"/><text class="numt" x="872" y="108">3</text>
    <text class="t" x="898" y="110">OpenRouter API</text>
    <text class="s" x="864" y="150">Via our serverless function</text>
    <text class="s" x="864" y="176">answers in about 1 second</text>
  </g>
  <g>
    <rect class="box" x="1220" y="68" width="300" height="140" rx="18"/>
    <circle class="num" cx="1252" cy="102" r="15"/><text class="numt" x="1252" y="108">4</text>
    <text class="t" x="1278" y="110">AI reads answers</text>
    <text class="s" x="1244" y="150">Ingest problems + monthly budget</text>
    <text class="s" x="1244" y="176">Keyword backup if AI is down</text>
  </g>
  <path class="arrow" d="M380,138 L456,138"/>
  <path class="arrow" d="M760,138 L836,138"/>
  <path class="arrow" d="M1140,138 L1216,138"/>
  <path class="arrow" d="M1370,208 L1370,326"/>

  <!-- Row B -->
  <g>
    <rect class="box" x="1220" y="330" width="300" height="140" rx="18"/>
    <circle class="num" cx="1252" cy="364" r="15"/><text class="numt" x="1252" y="370">5</text>
    <text class="t" x="1278" y="372">Transparent score</text>
    <text class="s" x="1244" y="412">Fits a problem? Then checks</text>
    <text class="s" x="1244" y="438">60% + budget fit 40%</text>
  </g>
  <g>
    <rect class="box" x="840" y="330" width="300" height="140" rx="18"/>
    <circle class="num" cx="872" cy="364" r="15"/><text class="numt" x="872" y="370">6</text>
    <text class="t" x="898" y="372">Results page</text>
    <text class="s" x="864" y="412">Compare, build a selection</text>
    <text class="s" x="864" y="438">with a running total</text>
  </g>
  <path class="arrow" d="M1220,400 L1144,400"/>

  <!-- Safeguards note -->
  <g>
    <rect class="note" x="80" y="330" width="680" height="140" rx="18"/>
    <text class="t" x="104" y="372">Built-in safeguards</text>
    <text class="s" x="104" y="412">AI key stays on the server · per-user rate limit · input limits</text>
    <text class="s" x="104" y="438">6-second AI timeout, then keyword backup · 50 automated tests</text>
  </g>

  <!-- Row C: data pipeline -->
  <g>
    <rect class="box" x="80" y="600" width="300" height="140" rx="18"/>
    <text class="t" x="104" y="642">Team database</text>
    <text class="s" x="104" y="682">Starting price, 4 checks,</text>
    <text class="s" x="104" y="708">summary, source link, date</text>
  </g>
  <g>
    <rect class="box" x="460" y="600" width="300" height="140" rx="18"/>
    <text class="t" x="484" y="642">Import + validator</text>
    <text class="s" x="484" y="682">One command converts it</text>
    <text class="s" x="484" y="708">and flags bad cells by row</text>
  </g>
  <g>
    <rect class="box" x="840" y="600" width="300" height="140" rx="18"/>
    <text class="t" x="864" y="642">Tool catalog</text>
    <text class="s" x="864" y="682">16 tools · 5 categories</text>
    <text class="s" x="864" y="708">every price has a source</text>
  </g>
  <path class="arrow" d="M380,670 L456,670"/>
  <path class="arrow" d="M760,670 L836,670"/>
  <path class="arrow" d="M1140,670 L1370,670 L1370,474"/>
</svg>
</body></html>
