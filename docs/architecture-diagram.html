<!doctype html>
<!-- Source for docs/architecture-diagram.png. Edit the labels here, then screenshot at 2x (1600x620). -->
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&display=swap">
<style>
  html, body { margin: 0; background: #EAE0CE; }
  svg { display: block; font-family: "Fraunces", Georgia, serif; }
  .box { fill: #fff; stroke: #3c4043; stroke-width: 1.5; }
  .note { fill: #f6f0e4; stroke: #3c4043; stroke-width: 1.5; stroke-dasharray: 7 6; }
  .t { font-size: 24px; fill: #2b2d30; font-weight: 600; }
  .arrow { stroke: #3c4043; stroke-width: 2.5; fill: none; marker-end: url(#head); }
  .num { fill: #3c4043; }
  .numt { fill: #fff; font-size: 16px; font-weight: 600; text-anchor: middle; }
</style></head><body>
<svg width="1600" height="620" viewBox="0 0 1600 620" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3c4043"/>
    </marker>
  </defs>

  <!-- Row 1: an owner's search -->
  <rect class="box" x="80" y="80" width="300" height="100" rx="18"/>
  <circle class="num" cx="112" cy="130" r="15"/><text class="numt" x="112" y="136">1</text>
  <text class="t" x="138" y="138">Owner answers</text>

  <rect class="box" x="460" y="80" width="300" height="100" rx="18"/>
  <circle class="num" cx="492" cy="130" r="15"/><text class="numt" x="492" y="136">2</text>
  <text class="t" x="518" y="138">Website</text>

  <rect class="box" x="840" y="80" width="300" height="100" rx="18"/>
  <circle class="num" cx="872" cy="130" r="15"/><text class="numt" x="872" y="136">3</text>
  <text class="t" x="898" y="138">OpenRouter API</text>

  <rect class="box" x="1220" y="80" width="300" height="100" rx="18"/>
  <circle class="num" cx="1252" cy="130" r="15"/><text class="numt" x="1252" y="136">4</text>
  <text class="t" x="1278" y="138">AI reads answers</text>

  <path class="arrow" d="M380,130 L456,130"/>
  <path class="arrow" d="M760,130 L836,130"/>
  <path class="arrow" d="M1140,130 L1216,130"/>
  <path class="arrow" d="M1370,180 L1370,266"/>

  <!-- Row 2 -->
  <rect class="note" x="80" y="270" width="680" height="100" rx="18"/>
  <text class="t" x="104" y="328">Built-in safeguards</text>

  <rect class="box" x="840" y="270" width="300" height="100" rx="18"/>
  <circle class="num" cx="872" cy="320" r="15"/><text class="numt" x="872" y="326">6</text>
  <text class="t" x="898" y="328">Results page</text>

  <rect class="box" x="1220" y="270" width="300" height="100" rx="18"/>
  <circle class="num" cx="1252" cy="320" r="15"/><text class="numt" x="1252" y="326">5</text>
  <text class="t" x="1278" y="328">Transparent score</text>

  <path class="arrow" d="M1220,320 L1144,320"/>

  <!-- Row 3: how tools get into the catalog -->
  <rect class="box" x="80" y="460" width="300" height="100" rx="18"/>
  <text class="t" x="104" y="518">Team database</text>

  <rect class="box" x="460" y="460" width="300" height="100" rx="18"/>
  <text class="t" x="484" y="518">Import + validator</text>

  <rect class="box" x="840" y="460" width="300" height="100" rx="18"/>
  <text class="t" x="864" y="518">Tool catalog</text>

  <path class="arrow" d="M380,510 L456,510"/>
  <path class="arrow" d="M760,510 L836,510"/>
  <path class="arrow" d="M1140,510 L1370,510 L1370,374"/>
</svg>
</body></html>
