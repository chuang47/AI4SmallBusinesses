<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Your Tools</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,400&display=swap">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="wide">
    <p class="status" id="loading">Finding tools that fit your business...</p>

    <div id="error" hidden>
      <p class="status" id="errorText"></p>
      <div class="buttons centered"><button id="retry">Try again</button></div>
    </div>

    <div id="content" hidden>
      <section class="understood">
        <p class="label">Here's what we understood <a href="index.html#review">Edit</a></p>
        <dl id="understood"></dl>
      </section>
      <p class="hint" id="hint">Tick 2-3 tools to compare them side by side.</p>
      <div id="cards"></div>
      <section id="compare" hidden>
        <p class="label">Compare</p>
        <div class="table-wrap"><table id="compareTable"></table></div>
      </section>
    </div>
  </main>

  <script>
    const TIMEOUT_MS = 10000;
    const MAX_COMPARE = 3;
    const useSample = new URLSearchParams(location.search).has("sample");
    const responses = JSON.parse(localStorage.getItem("responses") || "[]");
    const $ = (id) => document.getElementById(id);
    let categories, problems, data;
    const selected = new Set();

    function el(tag, props = {}, ...children) {
      const node = Object.assign(document.createElement(tag), props);
      node.append(...children);
      return node;
    }
    const price = (p) => (p == null ? "Price not published" : `$${p}/month`);

    function show(which) {
      for (const id of ["loading", "error", "content"]) $(id).hidden = id !== which;
    }

    async function getJson(url, options) {
      const res = await fetch(url, options);
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      return res.json();
    }

    async function load() {
      show("loading");
      try {
        [categories, problems] = await Promise.all([getJson("data/categories.json"), getJson("data/problems.json")]);
        const key = JSON.stringify(responses);
        const cached = JSON.parse(localStorage.getItem("results") || "null");
        if (useSample) {
          data = await getJson("data/sample-response.json");
        } else if (cached && cached.key === key) {
          data = cached.data; // reloading the page doesn't spend another API call
        } else {
          data = await getJson("api/recommend", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ responses }),
            signal: AbortSignal.timeout(TIMEOUT_MS),
          });
          localStorage.setItem("results", JSON.stringify({ key, data }));
        }
        render();
        show("content");
      } catch (err) {
        $("errorText").textContent =
          err.name === "TimeoutError"
            ? "This is taking longer than it should. Please try again."
            : err.message === "HTTP 429"
              ? "Too many requests in a short time. Wait a minute, then try again."
              : "Something went wrong finding your tools. Please try again.";
        show("error");
      }
    }

    function render() {
      const { profile, recommendations } = data;
      const name = (responses[0] && responses[0].answer.trim()) || "";
      const business = [name, profile.business_type && `(${profile.business_type})`].filter(Boolean).join(" ");
      const problemLabels = problems.filter((p) => profile.problems.includes(p.id)).map((p) => p.label);

      $("understood").replaceChildren(
        el("dt", { textContent: "Business" }), el("dd", { textContent: business || "Not given" }),
        el("dt", { textContent: "Problems" }), el("dd", { textContent: problemLabels.join("; ") || "Nothing we could match yet" }),
        el("dt", { textContent: "Budget" }), el("dd", { textContent: profile.budget == null ? "No limit given" : `$${profile.budget}/month` }),
      );

      if (recommendations.length === 0) {
        $("hint").hidden = true;
        const covered = Object.values(categories).map((c) => c.label.toLowerCase()).join(", ");
        $("cards").replaceChildren(
          el("p", { className: "status", textContent: `We couldn't match your answers to a problem we cover yet (${covered}). Try editing your answers to say more about your biggest challenge.` })
        );
        return;
      }
      $("hint").hidden = recommendations.length < 2;
      $("cards").replaceChildren(...recommendations.map(card));
      renderCompare();
    }

    function card(rec) {
      const [have, total] = rec.feature_coverage.split("/");
      const box = el("input", { type: "checkbox", checked: selected.has(rec.name) });
      box.addEventListener("change", () => {
        box.checked ? selected.add(rec.name) : selected.delete(rec.name);
        renderCompare();
      });
      return el("article", { className: "card" },
        el("div", { className: "card-head" },
          el("h2", { textContent: rec.name }),
          el("span", { className: "match", textContent: `${rec.match}/5` })),
        el("p", { className: "meta", textContent: `${price(rec.price_monthly)} · ${have} of ${total} features` }),
        el("p", { textContent: rec.summary }),
        el("ul", { className: "reasons" }, ...rec.reasons.map((r) => el("li", { textContent: r }))),
        el("div", { className: "card-foot" },
          el("label", {}, box, " Compare"),
          el("a", { href: rec.source_url, target: "_blank", rel: "noopener", textContent: "Source" })),
      );
    }

    function renderCompare() {
      // Lock the remaining checkboxes once the max is reached.
      $("cards").querySelectorAll("input[type=checkbox]").forEach((b) => {
        b.disabled = !b.checked && selected.size >= MAX_COMPARE;
      });
      const tools = data.recommendations.filter((r) => selected.has(r.name));
      $("compare").hidden = tools.length < 2;
      if (tools.length < 2) return;

      const cats = [...new Set(tools.map((t) => t.category))];
      const mixed = cats.length > 1;
      const row = (label, cells, cls) =>
        el("tr", cls ? { className: cls } : {}, el("th", { textContent: label }), ...cells.map((c) => el("td", { textContent: c })));
      const group = (label) =>
        el("tr", { className: "group" }, el("th", { colSpan: tools.length + 1, textContent: label }));
      const featureRows = (cat, list) =>
        Object.entries(list).map(([key, desc]) =>
          row(desc, tools.map((t) => (t.category === cat && t.features[key] ? "✓" : "–"))));

      const rows = [row("", tools.map((t) => t.name), "names"), row("Price", tools.map((t) => price(t.price_monthly)))];
      for (const cat of cats) {
        const suffix = mixed ? ` · ${categories[cat].label}` : "";
        rows.push(group("Core features" + suffix), ...featureRows(cat, categories[cat].table_stakes));
      }
      rows.push(row("Last verified", tools.map((t) => t.last_verified)));
      $("compareTable").replaceChildren(...rows);
    }

    $("retry").addEventListener("click", load);
    load();
  </script>
</body>
</html>
