<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Your Tools · Main Street AI</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;1,9..144,400&display=swap">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="wide">
    <h1 class="sr-only">Recommended tools for your business</h1>
    <p class="status" id="loading" role="status">Finding tools that fit your business...</p>

    <div id="error" hidden>
      <p class="status" id="errorText" role="alert"></p>
      <div class="buttons centered"><button id="retry">Try again</button></div>
    </div>

    <div id="content" hidden>
      <section class="understood">
        <p class="label">Here's what we understood <a href="index.html#review" aria-label="Edit your answers">Edit</a></p>
        <dl id="understood"></dl>
      </section>
      <p class="hint" id="hint">Select up to 3 tools to see your monthly total and compare them side by side.</p>
      <p class="hint" id="shopNote"></p>
      <div id="cards"></div>
      <p class="picks" id="picks" role="status" hidden></p>
      <section id="compare" hidden aria-labelledby="compareTitle">
        <h2 class="label" id="compareTitle">Compare</h2>
        <div class="table-wrap"><table id="compareTable"><caption class="sr-only">Side-by-side comparison of the tools you selected</caption></table></div>
      </section>
    </div>
  </main>

  <script>
    const TIMEOUT_MS = 10000;
    const MAX_COMPARE = 3;
    const useSample = new URLSearchParams(location.search).has("sample");
    let responses = [];
    try { responses = JSON.parse(localStorage.getItem("responses")) || []; } catch {}
    // Never went through the questions (e.g. opened this page directly): start there instead.
    // Saved-but-empty answers still proceed, since the review step only nudges, it doesn't block.
    const neverAnswered = !useSample && (!Array.isArray(responses) || responses.length === 0);
    if (neverAnswered) location.replace("index.html");
    const $ = (id) => document.getElementById(id);
    let categories, checks, data;
    const selected = new Set();

    function el(tag, props = {}, ...children) {
      const node = Object.assign(document.createElement(tag), props);
      node.append(...children);
      return node;
    }
    const money = (n) => `$${Number.isInteger(n) ? n : n.toFixed(2)}`;
    const price = (t) =>
      t.price_monthly != null ? `${money(t.price_monthly)}/month` : t.custom_pricing ? "Contact sales for pricing" : "Price not published";
    const labelOf = (id) => (categories.find((c) => c.id === id) || {}).label || id;

    function show(which) {
      for (const id of ["loading", "error", "content"]) $(id).hidden = id !== which;
    }

    async function getJson(url, options) {
      const res = await fetch(url, options);
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      return res.json();
    }

    async function load() {
      show("loading");
      try {
        let config;
        [categories, checks, config] = await Promise.all(
          ["categories", "checks", "config"].map((f) => getJson(`data/${f}.json`)));
        $("shopNote").textContent = `Prices are for a business with ${config.reference_shop}.`;
        const key = JSON.stringify(responses);
        let cached = null;
        try { cached = JSON.parse(localStorage.getItem("results")); } catch {}
        if (useSample) {
          data = await getJson("data/sample-response.json");
        } else if (cached && cached.key === key) {
          data = cached.data; // reloading the page doesn't spend another API call
        } else {
          data = await getJson("api/recommend", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ responses }),
            signal: AbortSignal.timeout(TIMEOUT_MS),
          });
          localStorage.setItem("results", JSON.stringify({ key, data }));
        }
        render();
        show("content");
      } catch (err) {
        $("errorText").textContent =
          err.name === "TimeoutError"
            ? "This is taking longer than it should. Please try again."
            : err.message === "HTTP 429"
              ? "Too many requests in a short time. Wait a minute, then try again."
              : "Something went wrong finding your tools. Please try again.";
        show("error");
      }
    }

    function render() {
      const { profile, recommendations } = data;
      const first = responses[0] && responses[0].answer;
      const name = (typeof first === "string" && first.trim()) || "";
      const business = [name, profile.business_type && `(${profile.business_type})`].filter(Boolean).join(" ");
      const problemLabels = profile.problems.map(labelOf);

      $("understood").replaceChildren(
        el("dt", { textContent: "Business" }), el("dd", { textContent: business || "Not given" }),
        el("dt", { textContent: "Problems" }), el("dd", { textContent: problemLabels.join("; ") || "Nothing we could match yet" }),
        el("dt", { textContent: "Budget" }), el("dd", { textContent: profile.budget == null ? "No limit given" : `$${profile.budget}/month` }),
      );

      if (recommendations.length === 0) {
        $("hint").hidden = true;
        $("shopNote").hidden = true;
        $("compare").hidden = true;
        const covered = categories.map((c) => c.label.toLowerCase()).join(", ");
        // Understood the problem but have no tools for it, vs. didn't recognise a problem at all.
        const message = problemLabels.length
          ? `We understood your challenge (${problemLabels.join(", ").toLowerCase()}), but we don't have tools for it in our catalog yet.`
          : `We couldn't match your answers to a problem we cover yet (${covered}). Try editing your answers to say more about your biggest challenge.`;
        $("cards").replaceChildren(el("p", { className: "status", textContent: message }));
        return;
      }
      $("hint").hidden = recommendations.length < 2;
      $("shopNote").hidden = false;
      $("cards").replaceChildren(...recommendations.map(card));
      renderCompare();
    }

    function card(rec) {
      const box = el("input", { type: "checkbox", checked: selected.has(rec.name) });
      box.setAttribute("aria-label", `Select ${rec.name}`);
      box.addEventListener("change", () => {
        box.checked ? selected.add(rec.name) : selected.delete(rec.name);
        renderCompare();
      });
      return el("article", { className: "card" },
        el("div", { className: "tags" },
          el("span", { className: "sr-only", textContent: "Helps with: " }),
          el("span", { className: "tag", textContent: labelOf(rec.category) })),
        el("div", { className: "card-head" },
          el("h2", { textContent: rec.name }),
          el("span", { className: "match" },
            el("span", { textContent: `${rec.match}/5`, ariaHidden: "true" }),
            el("span", { className: "sr-only", textContent: `Match ${rec.match} out of 5` }))),
        el("p", { className: "meta", textContent: [price(rec), rec.price_note].filter(Boolean).join(" · ") }),
        el("p", { textContent: rec.summary }),
        el("ul", { className: "reasons" }, ...rec.reasons.map((r) => el("li", { textContent: r }))),
        el("div", { className: "card-foot" },
          el("label", {}, box, " Select"),
          el("a", { href: rec.source_url, target: "_blank", rel: "noopener", textContent: "Source", ariaLabel: `${rec.name} pricing source (opens in a new tab)` })),
      );
    }

    function renderCompare() {
      // Lock the remaining checkboxes once the max is reached.
      $("cards").querySelectorAll("input[type=checkbox]").forEach((b) => {
        b.disabled = !b.checked && selected.size >= MAX_COMPARE;
      });
      const tools = data.recommendations.filter((r) => selected.has(r.name));

      // Running total of the tools they picked. Unpublished prices are named, never guessed.
      $("picks").hidden = tools.length === 0;
      if (tools.length) {
        const priced = tools.filter((t) => t.price_monthly != null);
        const total = priced.reduce((sum, t) => sum + t.price_monthly, 0);
        const unpriced = tools.length - priced.length;
        const amount = priced.length ? `${money(total)}/month` : "";
        const extra = unpriced ? `${unpriced} without a listed price` : "";
        $("picks").textContent = `Your picks: ${tools.map((t) => t.name).join(" + ")} = ${[amount, extra].filter(Boolean).join(" + ")}`;
      }

      $("compare").hidden = tools.length < 2;
      if (tools.length < 2) return;

      const row = (label, cells) =>
        el("tr", {}, el("th", { scope: "row", textContent: label }), ...cells.map((c) => el("td", {}, ...[].concat(c))));
      // ✓ / – on screen; "Yes" / "No" for screen readers.
      const mark = (yes) => [
        el("span", { textContent: yes ? "✓" : "–", ariaHidden: "true" }),
        el("span", { className: "sr-only", textContent: yes ? "Yes" : "No" }),
      ];

      const names = el("tr", { className: "names" },
        el("td"), ...tools.map((t) => el("th", { scope: "col", textContent: t.name })));
      const rows = [
        names,
        row("Price", tools.map(price)),
        row("Helps with", tools.map((t) => labelOf(t.category))),
        el("tr", { className: "group" }, el("th", { colSpan: tools.length + 1, textContent: "Small-business checks" })),
        ...Object.entries(checks).map(([key, desc]) => row(desc, tools.map((t) => mark(t.features[key])))),
        row("Last verified", tools.map((t) => t.last_verified)),
      ];
      $("compareTable").replaceChildren($("compareTable").querySelector("caption"), ...rows);
    }

    $("retry").addEventListener("click", load);
    if (!neverAnswered) load();
  </script>
</body>
</html>
